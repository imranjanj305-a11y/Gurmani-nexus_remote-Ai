name: Build Android APK
on:
  push:
    paths: ["android-agent/**", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
      - name: Build
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease -PappVersionCode=${{ github.run_number }}
        working-directory: android-agent
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-agent/app/build/outputs/apk/release/app-release.apk NexusAgent.apk
          gh release create "v${{ github.run_number }}" NexusAgent.apk --title "v${{ github.run_number }}" --notes "Auto build" --latest
